      - generic [ref=f12e74]:
        - paragraph [ref=f12e75]: Kính gửi Quý Đại biểu tham dự,
        - paragraph [ref=f12e76]: Hội Điện quang Can thiệp Hồ Chí Minh (SIRHCM) xin trân trọng gửi lời chào mừng nồng nhiệt đến Quý Đại biểu tham dự Hội nghị khoa học Điện Quang Can Thiệp Hồ Chí Minh lần thứ 2 (SIRHCM 2026).
        - paragraph [ref=f12e77]: Hội nghị này là dịp để các chuyên gia, bác sĩ, nhà khoa học và đồng nghiệp trong lĩnh vực Điện quang Can thiệp trên cả nước cùng gặp gỡ, chia sẻ kinh nghiệm, cập nhật kiến thức, cũng như thảo luận về những tiến bộ mới nhất trong chuyên ngành. Chúng tôi tin rằng sự góp mặt của Quý vị sẽ đóng vai trò quan trọng trong việc tạo nên một diễn đàn khoa học chất lượng và giàu giá trị thực tiễn.
        - paragraph [ref=f12e78]: Ban tổ chức xin chân thành cảm ơn sự quan tâm, đồng hành và ủng hộ của Quý vị. Kính chúc Quý Đại biểu có những trải nghiệm ý nghĩa, nhiều kết nối chuyên môn và một kỳ hội nghị thành công tốt đẹp.
        - paragraph [ref=f12e79]:
          - text: Trân trọng,
          - strong [ref=f12e80]: Hội Điện quang Can thiệp Hồ Chí Minh (SIRHCM)
